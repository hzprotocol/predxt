name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q -s

      - name: Build
        run: uv build

      - name: Check distributions
        run: |
          uv run twine check dist/*
          tar -tzf dist/predxt-*.tar.gz | grep 'tests/fixtures/polymarket_order_books.json'

      - name: Docs build
        run: uv run mkdocs build --strict

      - name: Example help smoke
        run: |
          uv run predxt --help
          uv run predxt parse-fixture --help
          uv run predxt stream polymarket --help
          uv run python examples/polymarket_market_stream.py --help
          uv run python examples/kalshi_market_stream.py --help
          uv run python examples/opinion_market_stream.py --help

      - name: Wheel install smoke
        run: |
          python -m venv /tmp/predxt-smoke
          /tmp/predxt-smoke/bin/python -m pip install --upgrade pip
          /tmp/predxt-smoke/bin/python -m pip install dist/*.whl
          /tmp/predxt-smoke/bin/python - <<'PY'
          import predxt
          import predxt.kalshi
          import predxt.opinion
          import predxt.polymarket

          assert predxt.__version__ == "0.1.0"
          PY
