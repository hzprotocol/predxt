name: Bug report
description: Report a reproducible predxt bug.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal snippet or fixture. Do not include secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: predxt version
      placeholder: "0.1.0"
  - type: dropdown
    id: venue
    attributes:
      label: Venue
      options:
        - Polymarket
        - Kalshi
        - Opinion
        - Core SDK
        - CLI/docs
