[project]
name = "predxt"
version = "0.2.0"
description = "Read-only prediction market data clients for Polymarket, Kalshi, and Opinion"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "hzprotocol" },
]
keywords = [
  "prediction-markets",
  "market-data",
  "orderbook",
  "rest",
  "websocket",
  "polymarket",
  "kalshi",
  "opinion",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.28.0",
  "pydantic>=2.0",
  "websockets>=10.0",
]

[project.scripts]
predxt = "predxt.cli:main"

[project.urls]
Documentation = "https://hzprotocol.github.io/predxt"
Homepage = "https://github.com/hzprotocol/predxt"
Repository = "https://github.com/hzprotocol/predxt"
Issues = "https://github.com/hzprotocol/predxt/issues"

[dependency-groups]
dev = [
  "build>=1.2.2",
  "mypy>=1.19.0",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.14",
  "twine>=6.2.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
predxt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["predxt"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
