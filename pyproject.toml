[project]
name = "predxt"
version = "0.1.0"
description = "Prediction market websocket clients for Polymarket, Kalshi, and Opinion"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "hzprotocol" },
]
keywords = [
  "prediction-markets",
  "websocket",
  "polymarket",
  "kalshi",
  "opinion",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "cryptography>=42.0.0",
  "pydantic>=2.0",
  "websockets>=10.0",
]

[project.urls]
Homepage = "https://github.com/hzprotocol/predxt"
Repository = "https://github.com/hzprotocol/predxt"
Issues = "https://github.com/hzprotocol/predxt/issues"

[dependency-groups]
dev = [
  "build>=1.2.2",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.14",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"
